# Bundled MQTT stack.
#
# One command brings up a Mosquitto broker, a sample publisher, the MQTT
# connector, and (from docker-compose.yml) the gateway + NATS + mock Building OS,
# so MQTT telemetry flows end-to-end with NO external infrastructure — mirroring
# the simulator-backed BACnet/OPC-UA stories:
#
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up --build
#
# The sample publisher publishes sensors/room1/temp and sensors/room1/humidity
# every 10s. Both points are in fixtures/point_list.json (room1_temperature,
# room1_humidity) under connector_id=mqtt-01. If you change CONNECTOR_ID or
# MQTT_POINTS here, update the Point List too or the Normalizer will drop events
# as unresolved.
#
# To point at an EXTERNAL broker instead, override MQTT_BROKER_URL with an
# address reachable from inside the connector container and start only the
# connector (skipping the bundled broker/publisher):
#   MQTT_BROKER_URL=mqtt://your-broker:1883 \
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up mqtt-connector
#
# For a TLS / mutual-TLS broker (mqtts://), mount the CA / client certificate /
# private key into the connector with a compose override file and set
# MQTT_CA_FILE / MQTT_CERT_FILE / MQTT_KEY_FILE to the mounted paths. Keep key
# material out of this repository (secrets/ is git-ignored).

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "11883:1883"   # host access for manual mosquitto_pub/sub (services use mqtt-broker:1883)
    volumes:
      - ./fixtures/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # mosquitto_pub returns 0 only if the broker accepts a connection.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt-publisher:
    image: eclipse-mosquitto:2
    depends_on:
      mqtt-broker:
        condition: service_healthy
    # Publish slowly-varying temperature / humidity every 10s so telemetry is
    # visible in `docker compose logs mqtt-publisher` and the gateway's /recent.
    # $$ escapes a literal $ for the container shell (compose would eat a single $).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "mqtt-publisher: publishing sensors/room1/temp and sensors/room1/humidity every 10s";
        while true; do
          t=$$(( 20 + $$(date +%S) % 6 ));
          h=$$(( 40 + $$(date +%S) % 10 ));
          mosquitto_pub -h mqtt-broker -p 1883 -t sensors/room1/temp -m "$$t";
          mosquitto_pub -h mqtt-broker -p 1883 -t sensors/room1/humidity -m "$$h";
          echo "mqtt-publisher: sensors/room1/temp=$$t sensors/room1/humidity=$$h";
          sleep 10;
        done
    restart: unless-stopped

  mqtt-connector:
    build:
      context: .
      dockerfile: connector/mqtt/Dockerfile
    environment:
      - CONNECTOR_ID=mqtt-01
      - NATS_URL=nats://nats:4222
      # Defaults to the bundled broker; override MQTT_BROKER_URL for an external one.
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mqtt-broker:1883}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-mqtt-01}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE:-30}
      - MQTT_SESSION_EXPIRY=${MQTT_SESSION_EXPIRY:-0}
      - MQTT_MAX_PAYLOAD_BYTES=${MQTT_MAX_PAYLOAD_BYTES:-1024}
      # Extra broker subscriptions beyond the point topics (e.g. [{"filter":"#","qos":1}]).
      - MQTT_SUBSCRIPTIONS=${MQTT_SUBSCRIPTIONS:-[]}
      - MQTT_IGNORE_TOPICS=${MQTT_IGNORE_TOPICS:-[]}
      # TLS (mqtts://) only — leave empty for the bundled plaintext broker.
      - MQTT_CA_FILE=${MQTT_CA_FILE:-}
      - MQTT_CERT_FILE=${MQTT_CERT_FILE:-}
      - MQTT_KEY_FILE=${MQTT_KEY_FILE:-}
      # Point a large topic list at a JSON file (see scripts/csv-to-mqtt-points.py)
      # instead of inlining it in MQTT_POINTS.
      - MQTT_POINTS_FILE=${MQTT_POINTS_FILE:-}
      - MQTT_POINTS=${MQTT_POINTS:-[{"topic":"sensors/room1/temp","device_ref":"mqtt://room1","unit":"Cel"},{"topic":"sensors/room1/humidity","device_ref":"mqtt://room1","unit":"%RH"}]}
    depends_on:
      nats:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
