# MQTT connector stack.
# Requires an MQTT 5.0 broker (e.g. Mosquitto). Use docker-compose.mqtt-dev.yml
# when you want a disposable local broker for smoke testing.
#
# Run with: docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up
#
# Set MQTT_BROKER_URL and MQTT_POINTS before starting:
#   MQTT_BROKER_URL=mqtt://<host>:1883 \
#   MQTT_POINTS='[{"topic":"sensors/room1/temp","device_ref":"mqtt://room1","unit":"Cel"},{"topic":"sensors/room1/humidity","device_ref":"mqtt://room1","unit":"%RH"}]' \
#   docker compose -f docker-compose.yml -f docker-compose.mqtt.yml up
#
# NOTE: The default MQTT_BROKER_URL (mqtt://localhost:1883) resolves to the
# container's own loopback interface, NOT the host machine. Always set
# MQTT_BROKER_URL explicitly to the broker's reachable address.
#
# The defaults below intentionally match fixtures/point_list.json:
# connector_id=mqtt-01 with local_id values sensors/room1/temp and
# sensors/room1/humidity. If you change CONNECTOR_ID or MQTT_POINTS here, update
# the Point List too or the Normalizer will drop events as unresolved.

services:
  mqtt-connector:
    build:
      context: .
      dockerfile: connector/mqtt/Dockerfile
    environment:
      - CONNECTOR_ID=mqtt-01
      - NATS_URL=nats://nats:4222
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtts://acbtqnaqfk0iu-ats.iot.ap-northeast-1.amazonaws.com:8883}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-mqtt-01}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE:-30}
      - MQTT_SESSION_EXPIRY=${MQTT_SESSION_EXPIRY:-0}
      - MQTT_MAX_PAYLOAD_BYTES=${MQTT_MAX_PAYLOAD_BYTES:-1024}
      - MQTT_SUBSCRIPTIONS=${MQTT_SUBSCRIPTIONS:-[{"filter":"#","qos":1}]}
      - MQTT_IGNORE_TOPICS=${MQTT_IGNORE_TOPICS:-["tas/heartbeat"]}
      - MQTT_CA_FILE=${MQTT_CA_FILE:-}
      - MQTT_CERT_FILE=/run/secrets/aws_iot_certificate
      - MQTT_KEY_FILE=/run/secrets/aws_iot_private_key
      - MQTT_POINTS_FILE=${MQTT_POINTS_FILE:-/config/mqtt-points.json}
      - MQTT_POINTS=${MQTT_POINTS:-[{"topic":"sensors/room1/temp","device_ref":"mqtt://room1","unit":"Cel"},{"topic":"sensors/room1/humidity","device_ref":"mqtt://room1","unit":"%RH"}]}
    volumes:
      - ./fixtures/mqtt/aws_iot_points.json:/config/mqtt-points.json:ro
    secrets:
      - aws_iot_certificate
      - aws_iot_private_key
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

secrets:
  aws_iot_certificate:
    file: ./secrets/147b0cabf573f178bc7dbbdefd40dc9da36893238a16ec8b09696d539dec164a-certificate.pem.crt
  aws_iot_private_key:
    file: ./secrets/147b0cabf573f178bc7dbbdefd40dc9da36893238a16ec8b09696d539dec164a-private.pem.key
