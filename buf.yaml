version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # Building OS owns these established names and language namespaces. Renaming
  # them would break the public gRPC contract, so nexus exempts only those rules.
  except:
    - PACKAGE_SAME_CSHARP_NAMESPACE
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
